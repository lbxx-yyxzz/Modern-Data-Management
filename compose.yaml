name: survey-course

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: survey_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: survey_course
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - ./deploy/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      - ./deploy/mongo-healthcheck.sh:/mongo-healthcheck.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/bin/sh", "/mongo-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_NAME: survey_course
      MONGO_HOST: mongo
      MONGO_APP_USER: survey_app
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
      COOKIE_SECURE: "1"
    secrets:
      - mongo_app_password
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - backend
      - edge

secrets:
  mongo_root_password:
    file: ./secrets/mongo-root-password.txt
  mongo_app_password:
    file: ./secrets/mongo-app-password.txt

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
